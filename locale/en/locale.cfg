[mod-setting-name]
bnm-construction-robots=Starter construction robots
bnm-logistic-robots=Starter logistic robots

[mod-setting-description]
bnm-construction-robots=Construction robots in the roboport of every new base, the home base and each outpost. A change applies only to bases founded after it.
bnm-logistic-robots=Logistic robots in the roboport of every new base, the home base and each outpost. A change applies only to bases founded after it.

# Generated per planet (prototypes/bnm_planet_power.lua): __1__ is the planet.
# bnm-radar's __2__ is the vanilla radar's own name, which Multi-Team Support
# turns into "Passive Radar" by default.
[entity-name]
bnm-roboport=Brave New Roboport
bnm-solar-panel=Solar panel (__1__)
bnm-accumulator=Accumulator (__1__)
bnm-radar=__2__ (__1__)
bnm-inserter=Inserter (__1__)

# __2__ in bnm-solar-panel is the planet's solar power in percent.
[entity-description]
bnm-roboport=The heart of a Brave New MTS base: twice the reach of a roboport, 16 charging docks, and it never freezes. It cannot be crafted or mined. Losing the home base's roboport eliminates the team; losing an outpost's roboport loses that outpost.
bnm-solar-panel=Tuned for __1__'s __2__% sunlight, so it gives more power there than an ordinary solar panel gives on Nauvis. It cannot be crafted, or mined while its base stands.
bnm-accumulator=Holds more energy and charges faster than an ordinary accumulator, sized to carry the base through __1__'s nights. It cannot be crafted, or mined while its base stands.
bnm-accumulator-fulgora=Holds twice the energy of an ordinary accumulator and charges more than three times faster, so it banks more of each lightning strike and carries the base through __1__'s days, when no lightning falls. It cannot be crafted, or mined while its base stands.
bnm-radar=Never freezes, so it keeps working on __1__ without heat. It cannot be crafted, or mined while its base stands.
bnm-inserter=Never freezes, so it keeps working on __1__ without heat. It cannot be crafted, or mined while its base stands.

# The bnm-roboport item needs no entry: an item that places an entity takes
# its name from the entity (entity-name.bnm-roboport above).
[item-name]
bnm-character-clone=Character Clone

[item-description]
bnm-character-clone=Ship one up to your team's space platform and fly it to another planet, then press "Establish base" in the platform hub to found an outpost there. It weighs a full rocket on its own.

[technology-name]
bnm-character-clone=Character Clone

[technology-description]
bnm-character-clone=Unlocks the Character Clone. Ship one up to your team's space platform and fly it to another planet, then press "Establish base" in the platform hub to found an outpost there.
